name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    name: Install deps & run pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      # Phase 1 ships only smoke tests (route wiring + auth enforcement) run
      # against a mocked environment — no live Postgres/Supabase is required.
      - name: Run pytest
        env:
          SUPABASE_JWT_SECRET: test-secret
          OPENAI_API_KEY: sk-test
        run: pytest -v

      # Phase 2: the worker entrypoint must import cleanly (Redis connections
      # are lazy, so this needs no running Redis server in CI).
      - name: Verify worker entrypoint imports
        env:
          SUPABASE_JWT_SECRET: test-secret
          OPENAI_API_KEY: sk-test
        run: python -c "import app.worker; print('app.worker import OK')"

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: novelengine-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
